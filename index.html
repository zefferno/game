<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ממלכת החשבון – הרפתקת point-and-click ללימוד לוח הכפל">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 24l-1-14 7 6 6-10 6 10 7-6-1 14z' fill='%23e8b84e' stroke='%239c7424' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='18' r='2.5' fill='%23d2495a'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>ממלכת החשבון</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Sans+Hebrew:wght@400;500;600;700&family=Noto+Serif+Hebrew:wght@600;700&family=Suez+One&display=swap">
<style>
/* Layout: an adventure-game cabinet — the 16:9 painted stage on top, a paper console (speech, choices, satchel) under it */
:root{
  --bg:#141833; --bg-2:#1f2550;
  --frame:#262c5c; --frame-hi:#39407a; --brass:#e8b84e; --brass-dk:#9c7424;
  --paper:#fbf6ea; --paper-2:#efe4cb; --paper-edge:#d9c79f;
  --ink:#2a2238; --ink-soft:#6a5d78;
  --moss:#3d8a5c; --moss-hi:#5cbf84; --moss-dk:#24553a;
  --berry:#d2495a; --math:#3a4fb8; --good:#2f9e63; --bad:#d2495a;
  --f-display:"Suez One","Frank Ruhl Libre","David",Georgia,serif;
  --f-body:"Fredoka","Varela Round","Arial Hebrew","Segoe UI",system-ui,sans-serif;
  --f-num:"Fredoka","Varela Round","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
/* with niqqud on, Hebrew is set in faces that carry the vowel marks */
:root.nq{--f-body:"Noto Sans Hebrew","Fredoka","Arial Hebrew",system-ui,sans-serif;--f-display:"Noto Serif Hebrew","Suez One","David",Georgia,serif}
.m,.key,.slot,.answer,.chain,.eqbig,.chip,.cell,.choice,.sel button,.stats b,.pop{font-family:var(--f-num)}
.choice.he{font-family:var(--f-body)}
.brand{font-family:"Suez One","David",Georgia,serif!important}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--paper);font-family:var(--f-body);font-size:17px;line-height:1.5;direction:rtl;
  background-image:radial-gradient(1200px 600px at 50% -10%,var(--bg-2),transparent 70%);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 20px;
  -webkit-tap-highlight-color:transparent}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.app{width:min(100%,calc((100dvh - 200px) * 16 / 9 + 20px));min-width:min(100%,340px);margin:0 auto;display:flex;flex-direction:column;gap:8px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:clamp(20px,3.6vw,28px);color:var(--brass);line-height:1;text-shadow:0 2px 0 #0007,0 0 18px #e8b84e44;display:flex;align-items:center;gap:8px}
.brand svg{width:28px;height:28px}
.stones{display:flex;gap:4px;align-items:center;padding:4px 10px;border-radius:999px;background:#0006;box-shadow:inset 0 0 0 1.5px #e8b84e55}
.stones svg{width:22px;height:22px;display:block}
.stones .got{filter:drop-shadow(0 0 5px currentColor)}
.tools{display:flex;gap:6px}
.ibtn{width:42px;height:42px;border-radius:12px;border:2px solid var(--brass-dk);background:linear-gradient(var(--frame-hi),var(--frame));color:var(--paper);display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 3px 0 #0006}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 #0006}
.ibtn svg{width:21px;height:21px}
.ibtn[aria-pressed="false"]{opacity:.55}
.ibtn[disabled]{opacity:.3;cursor:not-allowed}
.cabinet{border-radius:18px;padding:7px;background:linear-gradient(170deg,var(--frame-hi),var(--frame) 60%);box-shadow:inset 0 0 0 2px var(--brass-dk),0 14px 40px #0009}

/* stage */
.stage{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#1d2244;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.stage>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage>svg.layer{pointer-events:none}
#bg{transition:filter 2.6s ease}
.stage.gray #bg{filter:saturate(.3) brightness(.93)}
#hit{cursor:default}
#hit .hs{fill:transparent;cursor:pointer;outline:none}
#hit .hs:focus-visible{stroke:var(--brass);stroke-width:3;stroke-dasharray:6 5}
#hit .walkable{cursor:pointer}
.stage.busy #hit .hs{cursor:default}
.hlabel{position:absolute;pointer-events:none;transform:translate(-50%,-140%);background:#1b1f3bdd;color:#fff;font:600 clamp(12px,1.6vw,16px) var(--f-body);padding:3px 10px;border-radius:10px;white-space:nowrap;box-shadow:0 0 0 1.5px #e8b84e88;z-index:5}
.spark-btn{position:absolute;bottom:max(8px,env(safe-area-inset-bottom,0px));inset-inline-start:8px;width:38px;height:38px;border-radius:50%;border:2px solid #e8b84eaa;background:#1b1f3bcc;color:#ffe9a8;display:grid;place-items:center;cursor:pointer;padding:0;z-index:4}
.spark-btn svg{width:20px;height:20px}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.spark{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:3px solid #ffe27a;box-shadow:0 0 14px #ffe27a;animation:spark 1s ease-out 3}
@keyframes spark{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.6);opacity:0}}
.pop{position:absolute;font:400 clamp(22px,4vw,40px) var(--f-display);color:#fff;text-shadow:0 3px 0 #0006,0 0 20px var(--brass);animation:pop 1.4s ease-out forwards;white-space:nowrap;transform:translate(-50%,-50%)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-120%)}}
.confetti{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(560px) rotate(720deg);opacity:.2}}
.banner{position:absolute;inset-inline:0;top:14%;text-align:center;font:400 clamp(22px,4.6vw,46px) var(--f-display);color:#fff;text-shadow:0 3px 0 #0008,0 0 30px var(--brass);animation:banner 3.4s ease forwards;padding-inline:16px}
@keyframes banner{0%{opacity:0;transform:scale(.7)}15%{opacity:1;transform:scale(1.05)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.fade{position:absolute;inset:0;background:#0b0c1a;opacity:0;transition:opacity .35s;pointer-events:none;z-index:6}
.fade.on{opacity:1}

/* console */
.console{margin-top:7px;border-radius:12px;background:var(--paper);color:var(--ink);padding:10px 12px;min-height:118px;box-shadow:inset 0 0 0 2px var(--paper-edge),inset 0 -5px 0 var(--paper-2);display:flex;flex-direction:column;justify-content:center}
.c-idle{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.goal{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink-soft)}
.goal b{color:var(--ink);font-weight:600}
.goal svg{width:22px;height:22px;flex:none;color:var(--berry)}
.inv{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.inv-empty{font-size:14px;color:var(--ink-soft)}
.item{width:58px;height:58px;border-radius:12px;border:2px solid var(--paper-edge);background:radial-gradient(circle at 50% 35%,#fff,var(--paper-2));cursor:pointer;padding:3px;display:grid;place-items:center;position:relative}
.item svg{width:46px;height:46px}
.item[aria-pressed="true"]{border-color:var(--berry);box-shadow:0 0 0 3px #d2495a55;transform:translateY(-2px)}
.item.new{animation:newitem 1s ease 2}
@keyframes newitem{50%{transform:scale(1.18);box-shadow:0 0 0 4px #e8b84e}}
.c-say{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.portrait{flex:none;width:clamp(58px,10vw,84px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 30%,#fff,var(--paper-2));box-shadow:0 0 0 3px var(--brass),0 0 0 6px var(--frame);overflow:hidden;margin:4px}
.portrait svg{width:100%;height:100%;display:block}
.say-body{flex:1;min-width:0}
.who{font-family:var(--f-display);color:var(--moss-dk);font-size:clamp(15px,2vw,18px);line-height:1.2}
.say{font-size:clamp(17px,2.3vw,21px);line-height:1.5;min-height:2.6em;text-wrap:pretty}
.say-next{align-self:flex-end;flex:none}
.m{direction:ltr;unicode-bidi:isolate;display:inline-block;font-weight:600;color:var(--math);white-space:nowrap;font-variant-numeric:tabular-nums;padding:0 .12em}
.c-choice{display:flex;gap:12px;align-items:flex-start}
.opts{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.opt{text-align:start;font:500 clamp(15px,2vw,18px) var(--f-body);color:var(--ink);background:#fff;border:2px solid var(--paper-edge);border-radius:12px;padding:8px 12px;cursor:pointer;min-height:44px}
.opt:hover{border-color:var(--moss)}
.opt::before{content:"◂ ";color:var(--moss)}
.opt.done{color:var(--ink-soft)}
.btn{font:600 17px var(--f-body);border-radius:14px;padding:9px 18px;min-height:46px;border:2px solid #2a5d40;background:linear-gradient(var(--moss-hi),var(--moss));color:#fff;cursor:pointer;box-shadow:0 4px 0 var(--moss-dk);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-shadow:0 1px 0 #0004}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--moss-dk)}
.btn.alt{background:linear-gradient(#fff,var(--paper-2));color:var(--ink);border-color:var(--paper-edge);box-shadow:0 4px 0 #c4b083;text-shadow:none}
.btn.gold{background:linear-gradient(#ffd877,var(--brass));color:#4a3307;border-color:var(--brass-dk);box-shadow:0 4px 0 var(--brass-dk);text-shadow:none}
.btn svg{width:18px;height:18px}

/* modal cards: puzzles, lessons, book, title */
.modal{position:fixed;inset:0;background:#0b0c1acc;display:grid;place-items:center;z-index:50;direction:rtl;padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fadein .25s}
@keyframes fadein{from{opacity:0}}
.card{background:var(--paper);color:var(--ink);border-radius:18px;width:min(100%,820px);max-height:100%;overflow:auto;padding:16px;box-shadow:0 0 0 3px var(--brass),0 20px 60px #000;animation:cardin .3s ease}
@keyframes cardin{from{transform:translateY(16px) scale(.97)}}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.card h2{font:400 clamp(20px,3.4vw,28px) var(--f-display);margin:0;color:var(--frame);text-wrap:balance}
.card .kicker{font-size:13px;letter-spacing:.06em;color:var(--brass-dk);font-weight:600}
.close{width:44px;height:44px;border-radius:12px;border:2px solid var(--paper-edge);background:#fff;cursor:pointer;display:grid;place-items:center;color:var(--ink);flex:none;padding:0}
.close svg{width:20px;height:20px}
.dlg{display:flex;gap:12px;align-items:flex-start}
.vis{margin-top:10px;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px;min-width:0}
.vis svg{max-width:100%;height:auto;max-height:230px;overflow:visible}
.eqbig{font:600 clamp(22px,4.6vw,36px) var(--f-body);direction:ltr;color:var(--math);text-align:center;line-height:1.35}
.eqbig b{color:var(--berry)}
.eqbig div{white-space:nowrap}
.chain{display:flex;direction:ltr;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;font:600 clamp(20px,4.2vw,30px) var(--f-body)}
.chain .n{background:#fff;border:2px solid var(--paper-edge);border-radius:12px;padding:2px 12px;color:var(--math);min-width:2.2ch;text-align:center}
.chain .n.q{color:var(--berry);border-style:dashed}
.chain .n.hl{background:#fff1c4;border-color:var(--brass);color:#7a5200}
.chain .ar{font-size:.55em;color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;line-height:1}
.chips{display:flex;direction:ltr;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{font:600 18px var(--f-body);background:#fff;border:2px solid var(--paper-edge);border-radius:10px;padding:2px 10px;color:var(--math);font-variant-numeric:tabular-nums;animation:chipin .35s both}
.chip.hl{background:#fff1c4;border-color:var(--brass);color:#7a5200}
.chip small{display:block;font-size:11px;color:var(--ink-soft);text-align:center;font-weight:500}
@keyframes chipin{from{opacity:0;transform:translateY(6px)}}
.q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 22px;align-items:start}
.q-side{display:flex;flex-direction:column;align-items:center;gap:10px}
.answer{display:flex;align-items:center;gap:12px;justify-content:center;direction:ltr;font:600 clamp(26px,5.4vw,38px) var(--f-body);color:var(--ink);min-height:54px}
.slot{min-width:3ch;padding:0 8px;height:1.35em;line-height:1.35em;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 3px var(--paper-edge);text-align:center;color:var(--math)}
.slot.empty::after{content:"?";color:#c9b99a}
.slot.right{box-shadow:inset 0 0 0 3px var(--good);color:var(--good)}
.slot.wrongs{box-shadow:inset 0 0 0 3px var(--bad);color:var(--bad)}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.pad{display:grid;grid-template-columns:repeat(3,56px);gap:7px;direction:ltr}
.key{height:50px;border-radius:12px;font:600 23px var(--f-body);background:linear-gradient(#fff,#efe6d2);border:2px solid #d4c29c;box-shadow:0 3px 0 #b9a273;color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 #b9a273}
.key svg{width:24px;height:24px}
.key.ok{background:linear-gradient(var(--moss-hi),var(--moss));color:#fff;border-color:#2c5d41;box-shadow:0 3px 0 var(--moss-dk);font-size:16px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:400px}
.choice{font:600 clamp(19px,3.8vw,25px) var(--f-body);min-height:54px;border-radius:14px;border:2px solid #d4c29c;background:linear-gradient(#fff,#efe6d2);box-shadow:0 4px 0 #b9a273;color:var(--math);cursor:pointer;direction:ltr;padding:6px}
.choice.he{direction:rtl;color:var(--ink)}
.choice.right{background:linear-gradient(#c8f1d8,#93dcb2);border-color:var(--good)}
.choice.wrongs{background:linear-gradient(#ffd9dd,#f5aab3);border-color:var(--bad)}
.hintbtn{font:500 15px var(--f-body);background:none;border:2px dashed var(--paper-edge);border-radius:12px;padding:6px 12px;color:var(--ink-soft);cursor:pointer;display:inline-flex;gap:6px;align-items:center;min-height:40px}
.hintbtn svg{width:18px;height:18px}
.hintbox{margin-top:10px;padding:10px 12px;border-radius:12px;background:#fff7dc;border:2px solid #f1d98c;font-size:17px;animation:chipin .3s}
.hintbox .who{font-size:15px;color:#7a5200}
.starsrow{display:flex;gap:8px;justify-content:center}
.starsrow svg{width:44px;height:44px}
.row-end{display:flex;justify-content:flex-end;gap:10px;margin-top:12px;flex-wrap:wrap}
/* title */
.title-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px 24px;align-items:center}
.title-grid h1{font:400 clamp(30px,6vw,54px)/1.05 var(--f-display);margin:0;color:var(--frame);text-wrap:balance}
.title-grid p{margin:.5em 0 0;color:var(--ink-soft);max-width:40ch}
.field{display:flex;flex-direction:column;gap:6px;font-weight:500}
.field input{font:600 20px var(--f-body);padding:10px 14px;border-radius:12px;border:2px solid var(--paper-edge);background:#fff;color:var(--ink);min-height:48px;width:100%}
.heroes{display:flex;gap:10px}
.hero-pick{flex:1;border:3px solid var(--paper-edge);background:#fff;border-radius:16px;padding:6px 6px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 16px var(--f-body);color:var(--ink)}
.hero-pick svg{width:76px;height:76px}
.hero-pick[aria-pressed="true"]{border-color:var(--moss);background:#e9f7ee;box-shadow:0 0 0 3px #5cbf8455}
.stack{display:flex;flex-direction:column;gap:12px}
.how{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:14px;color:var(--ink-soft)}
.how span{display:flex;align-items:center;gap:6px}
.how svg{width:22px;height:22px;color:var(--moss)}
/* book */
.grid100{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:3px;direction:ltr;font-variant-numeric:tabular-nums}
.cell{aspect-ratio:1;border-radius:6px;display:grid;place-items:center;font:600 clamp(10px,2.4vw,15px) var(--f-body);background:#fff;color:#c9b99a;border:0;padding:0;cursor:pointer;box-shadow:inset 0 0 0 1px var(--paper-edge)}
.cell.h{background:var(--frame);color:var(--brass);cursor:default;box-shadow:none}
.cell.on{color:#fff;box-shadow:none;text-shadow:0 1px 0 #0004}
.cell.sel{outline:3px solid var(--berry);outline-offset:1px}
.book-detail{margin-top:12px;min-height:60px;display:flex;flex-direction:column;align-items:center;gap:6px}
.cert{border:3px double var(--brass-dk);border-radius:14px;padding:14px 16px;text-align:center;background:radial-gradient(circle at 50% 0,#fff,var(--paper))}
.cert .nm{font:400 clamp(26px,6vw,44px) var(--f-display);color:var(--berry);margin:4px 0}
.stats{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;color:var(--ink-soft);font-size:15px}
.stats b{display:block;font:700 26px var(--f-body);color:var(--ink);font-variant-numeric:tabular-nums}
.sel{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;direction:ltr}
.sel button{width:46px;height:46px;border-radius:12px;border:2px solid var(--paper-edge);background:#fff;font:600 19px var(--f-body);color:var(--math);cursor:pointer}
.sel button[aria-pressed="true"]{background:var(--math);color:#fff;border-color:var(--math)}

/* svg animation */
.bob{animation:bob 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-2px) scaleY(1.01)}}
.blink{animation:blink 4.6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.talking .mouth{animation:talk .2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
@keyframes talk{to{transform:scaleY(2.1)}}
.leg,.arm{transform-box:fill-box;transform-origin:50% 4%}
.walking .leg.f,.walking .arm.b{animation:swA .5s ease-in-out infinite alternate}
.walking .leg.b,.walking .arm.f{animation:swB .5s ease-in-out infinite alternate}
@keyframes swA{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
@keyframes swB{from{transform:rotate(24deg)}to{transform:rotate(-24deg)}}
.walking .bob{animation:wbob .25s ease-in-out infinite alternate}
@keyframes wbob{to{transform:translateY(-3px)}}
.wave-arm{animation:wavea .5s ease-in-out infinite alternate}
@keyframes wavea{from{transform:rotate(-150deg)}to{transform:rotate(-120deg)}}
.drift{animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-220px)}to{transform:translateX(1180px)}}
.stroll{animation:stroll linear infinite}
@keyframes stroll{from{transform:translateX(-120px)}to{transform:translateX(1080px)}}
.stroll-r{animation:strollr linear infinite}
@keyframes strollr{from{transform:translateX(1080px)}to{transform:translateX(-120px)}}
.spin{animation:spin 9s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.flag{animation:flag 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0 50%}
@keyframes flag{to{transform:skewY(8deg) scaleX(.9)}}
.sway{animation:sway 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.wave{animation:wave 2.6s ease-in-out infinite alternate}
@keyframes wave{to{transform:translateX(18px)}}
.tw{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
.flick{animation:flick .18s steps(2) infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{to{transform:scale(.94,1.06);opacity:.85}}
.smoke{animation:smoke 4s ease-out infinite;transform-box:fill-box;transform-origin:center}

@keyframes peck{0%,60%,100%{transform:rotate(0)}70%,80%{transform:rotate(28deg)}}
.tail{animation:tail 2.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0 100%}
@keyframes tail{to{transform:rotate(18deg)}}
.hover{animation:hover 2.2s ease-in-out infinite;transform-box:fill-box}
@keyframes hover{50%{transform:translateY(-6px)}}
.glint{animation:glint 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes glint{0%,100%{opacity:.2;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(45deg)}}
.jet{animation:jet .9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes jet{to{transform:scaleY(.9) scaleX(1.06)}}
.ripple{animation:ripple 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ripple{from{transform:scale(.3);opacity:.9}to{transform:scale(1.4);opacity:0}}
.mist{animation:mist 18s ease-in-out infinite alternate}
@keyframes mist{to{transform:translateX(-60px)}}
.dust{animation:dust 7s linear infinite}
@keyframes dust{0%{transform:translate(0,0);opacity:0}20%{opacity:.8}100%{transform:translate(30px,90px);opacity:0}}
.marker{animation:hover 1.2s ease-in-out infinite;transform-box:fill-box}
.loc{cursor:pointer}
.loc-in{transition:transform .2s}
.loc:hover .loc-in{transform:translateY(-6px)}
.loc.locked .loc-art{filter:grayscale(1) brightness(.85);opacity:.75}
.crack{opacity:0;transition:opacity .3s}
.crack.lit{opacity:1}
.shield{transition:opacity 1.2s,transform 1.2s;transform-box:fill-box;transform-origin:center}
.shield.broken{opacity:0;transform:scale(1.4)}
.flash{animation:flashk .5s}
@keyframes flashk{0%{opacity:.85}100%{opacity:0}}
.hop-arc{stroke-dasharray:200;stroke-dashoffset:200;animation:draw .5s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.arr-row{animation:rowin .4s both}
@keyframes rowin{from{opacity:0;transform:translateY(-8px)}}
.rot{transform-box:fill-box;transform-origin:center;animation:rot 1.6s 1s ease-in-out both}
@keyframes rot{to{transform:rotate(90deg)}}

/* living backgrounds */
.rise{animation:rise 9s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{transform:translateY(170px)}}
.sink{animation:sink 75s ease-in both}
@keyframes sink{to{transform:translateY(125px)}}
.dawn{animation:dawn 12s cubic-bezier(.5,0,.75,1) both}
@keyframes dawn{from{opacity:1}to{opacity:0}}
.dusk{animation:duskk 75s ease-in both}
@keyframes duskk{from{opacity:0}to{opacity:.34}}
.cshadow{animation:drift linear infinite}
.float-up{animation:floatup 19s linear infinite}

.steam{animation:steam 3s ease-out infinite;transform-box:fill-box;transform-origin:center;opacity:0}

@keyframes pass{0%{transform:translateX(330px)}55%,100%{transform:translateX(560px)}}
/* the apprentice's wand */
.arm-cast{display:none}
.casting .arm-cast{display:inline;animation:castpop .3s ease-out}
.casting .arm.f{opacity:0}
@keyframes castpop{from{opacity:.2}}

.cover{margin-top:14px;padding-top:10px;border-top:1.5px solid var(--paper-2)}
.cover-h{font:600 16px var(--f-body);text-align:center;margin-bottom:8px;color:var(--ink)}
.cover-s{font-size:14px;color:var(--ink-soft);text-align:center;margin-top:8px}
.cert .chips{margin-top:10px}
.geo-legend{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;align-items:flex-end;direction:rtl}
.geo-legend>div{display:flex;flex-direction:column;align-items:center;gap:2px;font:600 15px var(--f-body);color:var(--ink)}
.geo-legend svg{max-height:110px}
.gchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;direction:rtl;margin-top:6px}
.gchip{font:600 14px var(--f-body);background:#fff;border:2px solid var(--paper-edge);border-radius:10px;padding:3px 10px;color:var(--ink-soft);text-align:center}
.gchip.on{background:#e3f4e8;border-color:var(--moss-hi);color:var(--moss-dk)}
.gchip small{display:block;font:500 11px var(--f-num)}
.sel button.geo-t{width:auto;padding:0 14px;font:600 16px var(--f-body);direction:rtl}

.voice-pick{display:grid;gap:10px;margin:10px 0 4px}
.vsel{display:flex;flex-direction:column;gap:4px;font:600 15px var(--f-body);color:var(--ink)}
.vsel select{font:500 15px var(--f-body);padding:8px 10px;border-radius:10px;border:2px solid var(--paper-edge);background:#fff;color:var(--ink);max-width:100%}
.vtip{margin-top:10px;line-height:1.5}

/* settings */
.setrow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1.5px solid var(--paper-2)}
.setrow.col{flex-direction:column;align-items:stretch;border-bottom:0}
.setlabel{font:600 18px var(--f-body);color:var(--ink)}
.setsub{font-size:14px;color:var(--ink-soft);margin-top:2px}
.switch{flex:none;width:58px;height:34px;border-radius:17px;border:0;background:#d9cfbd;position:relative;cursor:pointer;padding:0;transition:background .2s}
.switch span{position:absolute;top:4px;inset-inline-start:4px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0004;transition:transform .2s}
.switch[aria-checked="true"]{background:var(--moss)}
.switch[aria-checked="true"] span{transform:translateX(-24px)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.seg button{flex:1 1 120px;min-height:46px;border-radius:12px;border:2px solid var(--paper-edge);background:#fff;font:600 16px var(--f-body);color:var(--ink);cursor:pointer}
.seg button[aria-checked="true"]{background:var(--frame);color:#fff;border-color:var(--frame)}
.seg button[disabled]{opacity:.4;cursor:not-allowed}
@media (max-width:700px){
  .q,.title-grid{grid-template-columns:minmax(0,1fr)}
  .console{padding:9px 10px}
  .card{padding:12px}
  .item{width:50px;height:50px}.item svg{width:40px;height:40px}
}
@media (max-width:380px){.pad{grid-template-columns:repeat(3,50px)}.key{height:46px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.001s!important}
}

    const r = await puzzle(crowQ(f.cracks), { char: 'crow', kicker: `המגן של אפסון: ${f.cracks + 1} מתוך ${CROW_QS.length}`, title: 'קרב התרגילים', onRight: () => { SFX.crack(); } });
    if (!r.solved) return say('crow', 'הא! {בָּרַחְתָּ|בָּרַחְתְּ}! המגן שלי עדיין שלם... בערך.');
    f.cracks++; save(); flash('#c9a8ff'); SFX.crack(); refresh();
  }
  f.shieldDown = true; save();
  document.querySelector('#actors .shield')?.classList.add('broken'); flash('#ffffff'); SFX.crack(); await wait(1300); refresh();
  await crowFinale();
}
async function crowFinale() {
  await talk([['crow', 'המגן שלי... נשבר! איך {עָשִׂיתָ|עָשִׂית} את זה?!'], ['hero', 'חשבתי, פירקתי והפכתי, בדיוק כמו שהחברים שלי לימדו אותי.'],
    ['crow', 'האמת... לקחתי את האבנים כי אף אחד לא רצה לשחק איתי. כולם אמרו שאפס זה כלום.'], ['owl', 'אפסון, אפס הוא לא כלום! בלי אפס אין 10, אין 20 ואין 100.'],
    ['crow', 'באמת? אז... אפשר להחזיר את הצבעים ולהיות חבר בממלכה?'], ['owl', 'בטח! NAME, {פתח|פתחי} את הצנצנות, והצבעים יחזרו הביתה!']]);
  await earnStone(4); S.done = true; save();
  await say('owl', 'הוּ-הוּ! בכפר כבר מתחיל החג. {בוא|בואי} נטוס לשם!');
  goRoom('square', 'festival');
}

/* ---- buttons & boot ---- */
function resumeGame() {
  const id = ROOMS[S.room] ? S.room : 'attic';
  goRoom(id, 'resume').then(() => { if (S.hx != null && !room.noHero) { const [x, y] = clampWalk(S.hx, S.hy); hero.x = x; hero.y = y; placeHero(); sortActors(); } });
}
window.claude?.hot?.snapshot?.(() => ({ S }));
function boot(data) {
  const L = (data && data.S) ? Object.assign(defaultState(), data.S) : load(); if (L) { if (L.voice && L.voiceMode === 'off') L.voiceMode = 'chars'; S = L; }
  document.documentElement.classList.toggle('nq', S.niqqud !== false); nqWalk(document.body);
  renderStones(); syncButtons(); renderInv(); showPane('idle');
  room = Object.assign({}, ROOMS.square, { noHero: true, onEnter: null }); roomId = 'square'; renderRoom();
  showTitle();
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
